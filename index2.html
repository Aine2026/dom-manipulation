
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Board</title>
    <link rel="stylesheet" href="index2.css">
</head>
<body>
    <header>
        <h1>Student Board</h1>
        <p>Student performance dashboard</p>
    </header>

    <main>
        <section class="statistics">
            <div class="stat-card">
                <h2>Total Students</h2>
                <p id="student-count">0</p>
            </div>

            <div class="stat-card">
                <h2>Average Score</h2>
                <p id="average-score">0</p>
            </div>

            <div class="stat-card">
                <h2>Top Students</h2>
                <p id="top-students">None</p>
            </div>
        </section>

        <h2>All Students</h2>
        <section id="student-board" class="student-grid"></section>
    </main>

    <script src="index2.js"></script>
</body>
</html>
